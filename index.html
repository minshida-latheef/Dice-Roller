<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dice Roller</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <main class="container">
        <h1>🎲 Dice Roller</h1>
        <p class="subtitle">Click the button and roll your dice!</p>

        <div id="dice" class="dice" aria-label="Dice showing 1">
            <span class="dot"></span>
        </div>

        <p id="result" aria-live="polite">Ready to roll?</p>

        <button id="rollButton" type="button">Roll Dice</button>
    </main>

</body>
</html>
